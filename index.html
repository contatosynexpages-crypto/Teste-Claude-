<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Minhas Músicas</title>
<style>
  :root {
    --bg: #121212; --card: #1e1e1e; --hover: #2a2a2a; --line: #2a2a2a;
    --text: #fff; --muted: #a7a7a7; --accent: #1db954;
    --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text);
         overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  input { font: inherit; user-select: text; -webkit-user-select: text; }
  svg { width: 24px; height: 24px; fill: currentColor; display: block; }

  .app { max-width: 720px; margin: 0 auto; min-height: 100%; position: relative; }

  /* Topo */
  .top { position: sticky; top: 0; z-index: 10; padding: calc(var(--safe-top) + 14px) 16px 10px;
         background: linear-gradient(var(--bg) 70%, transparent); display: flex; align-items: center; gap: 12px; }
  .top h1 { font-size: 24px; font-weight: 800; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; color: var(--text); flex-shrink: 0; }
  .icon-btn:active { background: var(--hover); }
  .pill { background: var(--accent); color: #000; font-weight: 700; padding: 8px 14px; border-radius: 999px; font-size: 14px; white-space: nowrap; }

  /* Conteúdo */
  main { padding: 0 8px calc(var(--safe-bottom) + 150px); }
  .sub { color: var(--muted); font-size: 13px; padding: 0 8px 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .play-big { width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: #000; display: grid; place-items: center; flex-shrink: 0; }
  .play-big:active { transform: scale(.94); }
  .search { width: 100%; background: #fff; color: #000; border: none; padding: 12px 16px; border-radius: 8px; font-size: 16px; margin: 0 0 12px; }
  .search:focus { outline: none; }
  .search-wrap { padding: 0 8px; }

  .row { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 6px; }
  .row:active { background: var(--hover); }
  .row .meta { flex: 1; min-width: 0; }
  .cover, .cover-ph { width: 48px; height: 48px; border-radius: 4px; object-fit: cover; flex-shrink: 0; background: #333; }
  .cover-ph { display: grid; place-items: center; color: #777; }
  .t-title { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t-artist { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .row.playing .t-title { color: var(--accent); }
  .row .more { color: var(--muted); width: 36px; height: 36px; display: grid; place-items: center; }
  .fav-dot { color: var(--accent); }
  .fav-dot svg { width: 16px; height: 16px; }

  .pl-cover { width: 56px; height: 56px; border-radius: 4px; display: grid; place-items: center; background: linear-gradient(135deg, #450af5, #8e8ee5); flex-shrink: 0; }
  .pl-cover.liked { background: linear-gradient(135deg, #450af5, #c4efd9); }
  .pl-cover.new { background: var(--hover); color: var(--muted); }

  .empty { text-align: center; padding: 60px 24px; color: var(--muted); line-height: 1.5; }
  .empty h2 { color: var(--text); margin-bottom: 8px; font-size: 20px; }
  .empty .pill { display: inline-block; margin-top: 20px; padding: 12px 24px; font-size: 15px; }

  /* Mini player */
  .mini { position: fixed; left: 8px; right: 8px; bottom: calc(var(--safe-bottom) + 64px); max-width: 704px; margin: 0 auto;
          background: #3a2a1f; border-radius: 8px; padding: 8px; display: none; align-items: center; gap: 10px; z-index: 20; overflow: hidden; }
  .mini.show { display: flex; }
  .mini .cover, .mini .cover-ph { width: 40px; height: 40px; }
  .mini .meta { flex: 1; min-width: 0; }
  .mini .t-title { font-size: 14px; font-weight: 600; }
  .mini .t-artist { font-size: 12px; color: #ddd; }
  .mini-bar { position: absolute; left: 8px; right: 8px; bottom: 2px; height: 2px; background: rgba(255,255,255,.25); border-radius: 1px; }
  .mini-bar i { display: block; height: 100%; width: 0; background: #fff; border-radius: 1px; }

  /* Abas */
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center;
          padding: 6px 0 calc(var(--safe-bottom) + 6px); background: linear-gradient(transparent, rgba(0,0,0,.92) 30%); }
  .tabs-inner { display: flex; width: 100%; max-width: 720px; }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--muted); padding: 4px 0; }
  .tab.active { color: var(--text); }

  /* Player em tela cheia */
  .full { position: fixed; inset: 0; z-index: 40; background: linear-gradient(180deg, #4a3526 0%, #121212 75%);
          display: flex; flex-direction: column; padding: calc(var(--safe-top) + 10px) 24px calc(var(--safe-bottom) + 24px);
          transform: translateY(100%); transition: transform .3s ease; }
  .full.open { transform: none; }
  .full-inner { max-width: 480px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .full-top { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
  .full-art { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 0; min-height: 0; }
  .full-art img, .full-art .cover-ph { width: 100%; max-width: 360px; aspect-ratio: 1; height: auto; max-height: 100%; object-fit: cover; border-radius: 8px; box-shadow: 0 8px 40px rgba(0,0,0,.5); }
  .full-art .cover-ph svg { width: 30%; height: 30%; }
  .full-info { display: flex; align-items: center; gap: 12px; }
  .full-info .meta { flex: 1; min-width: 0; }
  .full-info .t-title { font-size: 22px; font-weight: 700; }
  .full-info .t-artist { font-size: 16px; }
  .fav-btn.on { color: var(--accent); }
  .seek-wrap { margin-top: 18px; }
  .times { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 4px; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 2px; background: #555; outline: none; touch-action: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #fff; }
  input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: none; }
  .ctrls { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; }
  .ctrls .icon-btn svg { width: 30px; height: 30px; }
  .ctrls .toggle { color: var(--text); position: relative; }
  .ctrls .toggle svg { width: 24px; height: 24px; }
  .ctrls .toggle.on { color: var(--accent); }
  .ctrls .toggle.on::after { content: ""; position: absolute; bottom: 2px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--accent); }
  .big-play { width: 66px; height: 66px; border-radius: 50%; background: #fff; color: #000; display: grid; place-items: center; }
  .big-play svg { width: 30px; height: 30px; }
  .big-play:active { transform: scale(.94); }

  /* Folha de opções */
  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 50; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 51; background: #282828; border-radius: 12px 12px 0 0;
           padding: 8px 8px calc(var(--safe-bottom) + 12px); max-width: 720px; margin: 0 auto; max-height: 80vh; overflow-y: auto;
           transform: translateY(100%); transition: transform .25s ease; }
  .sheet.open { transform: none; }
  .sheet .handle { width: 36px; height: 4px; background: #555; border-radius: 2px; margin: 4px auto 12px; }
  .sheet .head { display: flex; gap: 12px; align-items: center; padding: 0 8px 12px; border-bottom: 1px solid #3e3e3e; margin-bottom: 6px; }
  .sheet .opt { display: flex; align-items: center; gap: 16px; width: 100%; text-align: left; padding: 14px 12px; border-radius: 6px; font-size: 15px; }
  .sheet .opt:active { background: #3e3e3e; }
  .sheet .opt.danger { color: #ff6b6b; }

  .yt-input { width: 100%; background: #3e3e3e; color: var(--text); border: none; padding: 14px 12px; border-radius: 6px; font-size: 16px; }
  .yt-input:focus { outline: 2px solid var(--accent); }
  .yt-actions { display: flex; gap: 8px; margin-top: 12px; }
  .yt-actions button { flex: 1; padding: 12px; font-size: 15px; }
  .yt-actions .ghost { background: transparent; color: var(--text); border: 1px solid #777; }
  .yt-note { color: var(--muted); font-size: 12px; margin-top: 12px; line-height: 1.4; }
  .dl { position: fixed; left: 8px; right: 8px; top: calc(var(--safe-top) + 64px); max-width: 704px; margin: 0 auto; z-index: 30;
        background: #282828; border-radius: 8px; padding: 10px 12px; display: none; align-items: center; gap: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  .dl.show { display: flex; }
  .dl .meta { flex: 1; min-width: 0; font-size: 13px; }
  .dl .bar { height: 3px; background: #555; border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .dl .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .dl button { color: var(--muted); font-size: 13px; font-weight: 600; }
  .toast { position: fixed; left: 50%; bottom: calc(var(--safe-bottom) + 140px); transform: translateX(-50%) translateY(20px);
           background: #fff; color: #000; padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; z-index: 60;
           opacity: 0; transition: .25s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%); }

  .drop-hint { position: fixed; inset: 0; background: rgba(29,185,84,.15); border: 3px dashed var(--accent); display: none;
               place-items: center; font-size: 24px; font-weight: 800; z-index: 70; pointer-events: none; }
  body.dragging .drop-hint { display: grid; }
</style>

<script>
// ---------- Armazenamento (IndexedDB) ----------
const DB_NAME = 'minhas-musicas', DB_VER = 1;
let db;
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('tracks', { keyPath: 'id' });
      d.createObjectStore('files');
      d.createObjectStore('playlists', { keyPath: 'id' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function tx(store, mode, fn) {
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode);
    const out = fn(t.objectStore(store));
    t.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
    t.onerror = () => rej(t.error);
  });
}
const getAll = s => tx(s, 'readonly', st => st.getAll());
const put = (s, v, k) => tx(s, 'readwrite', st => st.put(v, k));
const del = (s, k) => tx(s, 'readwrite', st => st.delete(k));
const getFile = id => tx('files', 'readonly', st => st.get(id));

// ---------- Leitura de tags ID3 (título, artista, álbum, capa) ----------
async function readTags(file) {
  const tags = {};
  try {
    const head = new Uint8Array(await file.slice(0, 10).arrayBuffer());
    if (head[0] !== 0x49 || head[1] !== 0x44 || head[2] !== 0x33) return tags; // "ID3"
    const ver = head[3];
    const size = (head[6] << 21) | (head[7] << 14) | (head[8] << 7) | head[9];
    const buf = new Uint8Array(await file.slice(10, 10 + size).arrayBuffer());
    const dec = (bytes, enc) => {
      const label = enc === 1 ? 'utf-16' : enc === 2 ? 'utf-16be' : enc === 3 ? 'utf-8' : 'latin1';
      return new TextDecoder(label).decode(bytes).replace(/\0+$/, '').split('\0')[0].trim();
    };
    let i = 0;
    const idLen = ver === 2 ? 3 : 4, hdrLen = ver === 2 ? 6 : 10;
    const map = ver === 2 ? { TT2: 'title', TP1: 'artist', TAL: 'album', PIC: 'pic' }
                          : { TIT2: 'title', TPE1: 'artist', TALB: 'album', APIC: 'pic' };
    while (i + hdrLen < buf.length) {
      const id = String.fromCharCode(...buf.slice(i, i + idLen));
      if (!/^[A-Z0-9]+$/.test(id)) break;
      let fsize;
      if (ver === 2) fsize = (buf[i+3] << 16) | (buf[i+4] << 8) | buf[i+5];
      else if (ver === 4) fsize = (buf[i+4] << 21) | (buf[i+5] << 14) | (buf[i+6] << 7) | buf[i+7];
      else fsize = (buf[i+4] << 24) | (buf[i+5] << 16) | (buf[i+6] << 8) | buf[i+7];
      const data = buf.slice(i + hdrLen, i + hdrLen + fsize);
      const key = map[id];
      if (key === 'pic') {
        const enc = data[0];
        let p = 1, mime = 'image/jpeg';
        if (ver === 2) { p = 4; if (String.fromCharCode(...data.slice(1, 4)) === 'PNG') mime = 'image/png'; }
        else { const e = data.indexOf(0, 1); mime = new TextDecoder().decode(data.slice(1, e)) || mime; p = e + 1; }
        p++; // tipo da imagem
        if (enc === 1 || enc === 2) { while (p < data.length - 1 && !(data[p] === 0 && data[p+1] === 0)) p += 2; p += 2; }
        else { while (p < data.length && data[p] !== 0) p++; p++; }
        if (!mime.includes('/')) mime = 'image/' + mime.toLowerCase().replace('jpg', 'jpeg');
        tags.cover = new Blob([data.slice(p)], { type: mime });
      } else if (key) {
        tags[key] = dec(data.slice(1), data[0]);
      }
      i += hdrLen + fsize;
    }
  } catch (e) { /* tags inválidas: usa o nome do arquivo */ }
  return tags;
}

function durationOf(file) {
  return new Promise(res => {
    const a = new Audio(), url = URL.createObjectURL(file);
    const done = d => { res(d || 0); URL.revokeObjectURL(url); };
    a.preload = 'metadata';
    a.onloadedmetadata = () => done(a.duration);
    a.onerror = () => done(0);
    setTimeout(() => done(0), 5000);
    a.src = url;
  });
}

// ---------- Estado ----------
let tracks = [], playlists = [];
let view = { type: 'all' }, query = '';
let queue = [], qIndex = -1, shuffle = false, repeat = 'off'; // off | all | one
const coverUrls = {};
const audio = document.getElementById('audio');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const fmt = s => { s = Math.floor(s || 0); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const icon = (name, cls = '') => `<svg class="${cls}"><use href="#i-${name}"/></svg>`;
const setIcon = (el, name) => el.querySelector('use').setAttribute('href', '#i-' + name);
function coverUrl(t) { return coverUrls[t.id] ||= URL.createObjectURL(t.cover); }
const coverHtml = t => t && t.cover ? `<img class="cover" src="${coverUrl(t)}" alt="">` : `<div class="cover-ph">${icon('note')}</div>`;
const current = () => queue[qIndex];
const isMobile = () => matchMedia('(pointer: coarse)').matches;

function toast(msg) {
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 1800);
}

// ---------- Importar músicas ----------
async function importFiles(fileList) {
  const files = [...fileList].filter(f => f.type.startsWith('audio/') || /\.(mp3|m4a|aac|ogg|oga|opus|wav|flac|webm)$/i.test(f.name));
  if (!files.length) { toast('Nenhum arquivo de áudio'); return; }
  const existing = new Set(tracks.map(t => t.name + '|' + t.size));
  let added = 0;
  for (const [n, f] of files.entries()) {
    renderLoading(`Importando ${n + 1} de ${files.length}…`);
    if (existing.has(f.name + '|' + f.size)) continue;
    const tags = await readTags(f);
    const base = f.name.replace(/\.[^.]+$/, '');
    const [artist, title] = base.includes(' - ') ? base.split(' - ', 2) : ['', base];
    const t = {
      id: crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random(),
      name: f.name, size: f.size,
      title: tags.title || title.trim(),
      artist: tags.artist || artist.trim() || 'Artista desconhecido',
      album: tags.album || '',
      cover: tags.cover || null,
      duration: await durationOf(f),
      fav: false, added: Date.now()
    };
    await put('files', f, t.id);
    await put('tracks', t);
    tracks.push(t);
    added++;
  }
  render();
  toast(added ? `${added} música${added > 1 ? 's' : ''} adicionada${added > 1 ? 's' : ''}` : 'Essas músicas já estão na biblioteca');
}

// ---------- Baixar do YouTube (só no app Android) ----------
const YT = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.YouTube;
const dlQueue = [];
let dlBusy = false;

function addSheet() {
  openSheet(`<div class="head"><div class="t-title">Adicionar músicas</div></div>
    <button class="opt" data-s="files">${icon('file')}Arquivos do celular</button>
    <button class="opt" data-s="yt"><svg style="color:#ff4e45"><use href="#i-yt"/></svg>Baixar do YouTube (link)</button>`);
  $('sheet').onclick = e => {
    const b = e.target.closest('[data-s]'); if (!b) return;
    if (b.dataset.s === 'files') { closeSheet(); $('fileInput').click(); }
    else ytSheet();
  };
}

function ytSheet() {
  if (!YT) {
    openSheet(`<div class="head"><div class="t-title">Baixar do YouTube</div></div>
      <p class="yt-note" style="padding:0 8px 12px;font-size:14px">Essa função está disponível no app Android (APK). No navegador não é possível baixar do YouTube.</p>`);
    $('sheet').onclick = null;
    return;
  }
  openSheet(`<div class="head"><svg style="color:#ff4e45"><use href="#i-yt"/></svg><div class="t-title">Baixar do YouTube</div></div>
    <div style="padding:0 8px 8px">
      <input class="yt-input" id="ytUrl" type="url" inputmode="url" placeholder="Cole o link do vídeo aqui" autocomplete="off">
      <div class="yt-actions">
        <button class="pill ghost" id="ytPaste">Colar</button>
        <button class="pill" id="ytGo">Baixar</button>
      </div>
      <p class="yt-note">Dica: no app do YouTube, toque em <b>Compartilhar</b> e escolha <b>Minhas Músicas</b> para baixar direto.<br>Baixe apenas conteúdo que você tem direito de baixar.</p>
    </div>`);
  $('sheet').onclick = null;
  const input = $('ytUrl');
  setTimeout(() => input.focus(), 300);
  $('ytPaste').onclick = async () => {
    try { input.value = (await navigator.clipboard.readText()).trim(); }
    catch (e) { toast('Toque e segure no campo para colar'); input.focus(); }
  };
  const go = () => {
    const url = extractUrl(input.value);
    if (!url) { toast('Link inválido'); return; }
    closeSheet(); queueDownload(url);
  };
  $('ytGo').onclick = go;
  input.onkeydown = e => { if (e.key === 'Enter') go(); };
}

function extractUrl(text) {
  const m = String(text || '').match(/https?:\/\/\S+/);
  return m ? m[0] : null;
}

function queueDownload(url) {
  dlQueue.push(url);
  if (dlBusy) toast(`Na fila (${dlQueue.length})`);
  else runDownloads();
}

async function runDownloads() {
  dlBusy = true;
  while (dlQueue.length) {
    const url = dlQueue.shift();
    $('dlText').textContent = 'Baixando do YouTube…' + (dlQueue.length ? ` (+${dlQueue.length} na fila)` : '');
    $('dlBar').style.width = '0';
    $('dl').classList.add('show');
    try {
      const r = await YT.download({ url });
      $('dlText').textContent = 'Salvando…';
      const t = await saveYoutubeTrack(r);
      toast(t ? `Baixada: ${t.title}` : 'Essa música já está na biblioteca');
    } catch (e) {
      if (e && e.code !== 'CANCELED') toast((e && e.message) || 'Falha no download');
    }
  }
  $('dl').classList.remove('show');
  dlBusy = false;
}

function cleanYoutubeInfo(r) {
  let title = r.track || r.title || 'Sem título';
  let artist = r.artist || '';
  if (!r.track && !artist) {
    const m = title.match(/^(.+?)\s+[-–—|]\s+(.+)$/);
    if (m) { artist = m[1]; title = m[2]; }
  }
  if (!artist) artist = (r.uploader || '').replace(/\s*-\s*Topic$/i, '').replace(/VEVO$/i, '');
  title = title.replace(/\s*[(\[][^)\]]*\b(official|oficial|lyrics?|letra|audio|áudio|video|vídeo|clipe|clip|visualizer|hd|4k|mv)\b[^)\]]*[)\]]/gi, '').trim();
  return { title: title || r.title, artist: artist.trim() || 'Artista desconhecido' };
}

async function saveYoutubeTrack(r) {
  try {
    if (tracks.some(t => t.ytId && t.ytId === r.id)) return null;
    const file = await (await fetch(Capacitor.convertFileSrc(r.path))).blob();
    const cover = r.cover ? await (await fetch(r.cover)).blob() : null;
    const { title, artist } = cleanYoutubeInfo(r);
    const t = {
      id: crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random(),
      name: r.path.split('/').pop(), size: file.size, ytId: r.id,
      title, artist, album: '', cover,
      duration: r.duration || await durationOf(file),
      fav: false, added: Date.now()
    };
    await put('files', file, t.id);
    await put('tracks', t);
    tracks.push(t);
    if (view.type !== 'search') render();
    return t;
  } finally {
    YT.deleteFile({ path: r.path }).catch(() => {});
  }
}

if (YT) {
  YT.addListener('progress', p => { $('dlBar').style.width = Math.max(0, Math.min(100, p.progress)) + '%'; });
  YT.addListener('shared', d => {
    const url = extractUrl(d.text);
    if (url) queueDownload(url); else toast('Nenhum link no que foi compartilhado');
  });
  $('dlCancel').onclick = () => { dlQueue.length = 0; YT.cancel(); };
}

// ---------- Telas ----------
function listFor(v) {
  let list;
  if (v.type === 'fav') list = tracks.filter(t => t.fav);
  else if (v.type === 'pl') {
    const pl = playlists.find(p => p.id === v.id);
    list = pl ? pl.tracks.map(id => tracks.find(t => t.id === id)).filter(Boolean) : [];
  } else list = [...tracks].sort((a, b) => a.title.localeCompare(b.title));
  if (v.type === 'search') {
    const q = query.trim().toLowerCase();
    list = q ? list.filter(t => (t.title + ' ' + t.artist + ' ' + t.album).toLowerCase().includes(q)) : [];
  }
  return list;
}

function trackRows(list) {
  const cur = current();
  return list.map((t, i) => `
    <div class="row ${cur && cur.id === t.id ? 'playing' : ''}" data-i="${i}" data-id="${t.id}">
      ${coverHtml(t)}
      <div class="meta"><div class="t-title">${esc(t.title)}</div>
        <div class="t-artist">${t.fav ? `<span class="fav-dot">♥</span> ` : ''}${esc(t.artist)}${t.duration ? ' · ' + fmt(t.duration) : ''}</div></div>
      <button class="more" data-act="more">${icon('more')}</button>
    </div>`).join('');
}

function renderLoading(msg) { $('main').innerHTML = `<div class="empty"><h2>${msg}</h2></div>`; }

function render() {
  const main = $('main');
  const tabFor = view.type === 'pl' ? 'pls' : view.type;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tabFor));
  const pl = view.type === 'pl' ? playlists.find(p => p.id === view.id) : null;
  $('title').textContent = { all: 'Sua Biblioteca', search: 'Buscar', fav: 'Curtidas', pls: 'Playlists' }[view.type] || (pl ? pl.name : '');
  $('addBtn').hidden = view.type !== 'all';

  if (view.type === 'pls') {
    main.innerHTML = `
      <div class="row" data-act="newpl"><div class="pl-cover new">${icon('plus')}</div>
        <div class="meta"><div class="t-title">Criar playlist</div></div></div>
      <div class="row" data-go="fav"><div class="pl-cover liked">${icon('heart')}</div>
        <div class="meta"><div class="t-title">Músicas Curtidas</div><div class="t-artist">${tracks.filter(t => t.fav).length} músicas</div></div></div>
      ${playlists.map(p => `
        <div class="row" data-pl="${p.id}"><div class="pl-cover">${icon('note')}</div>
          <div class="meta"><div class="t-title">${esc(p.name)}</div><div class="t-artist">Playlist · ${p.tracks.length} músicas</div></div></div>`).join('')}`;
    return;
  }

  if (view.type === 'search') {
    const had = document.activeElement && document.activeElement.id === 'search';
    if (!$('search')) main.innerHTML = `<div class="search-wrap"><input class="search" id="search" type="search" placeholder="O que você quer ouvir?" enterkeyhint="search"></div><div id="results"></div>`;
    const s = $('search'); s.value = query;
    s.oninput = () => { query = s.value; render(); };
    const list = listFor(view);
    $('results').innerHTML = query.trim()
      ? (list.length ? trackRows(list) : `<div class="empty">Nada encontrado para "${esc(query)}".</div>`)
      : `<div class="empty">Busque por música, artista ou álbum.</div>`;
    if (had) s.focus();
    return;
  }

  const list = listFor(view);
  const totalDur = list.reduce((s, t) => s + (t.duration || 0), 0);
  let html = '';
  if (!tracks.length && view.type === 'all') {
    html = `<div class="empty"><h2>Sua biblioteca está vazia</h2>
      <p>Adicione as músicas baixadas no seu celular (MP3, M4A, FLAC, OGG, WAV…) ou baixe pelo link do YouTube.</p>
      <button class="pill" data-act="add">Adicionar músicas</button>
      ${isMobile() ? '' : '<br><button class="pill" data-act="folder" style="background:transparent;color:#fff;border:1px solid #777">Adicionar pasta</button>'}</div>`;
  } else {
    html = `<div class="sub"><span>${list.length} música${list.length === 1 ? '' : 's'} · ${Math.round(totalDur / 60)} min</span>
      <span style="display:flex;gap:4px;align-items:center">
        ${pl ? `<button class="icon-btn" data-act="plmenu">${icon('more')}</button>` : ''}
        ${list.length ? `<button class="play-big" data-act="playall">${icon('play')}</button>` : ''}</span></div>`;
    html += list.length ? trackRows(list)
      : `<div class="empty">${view.type === 'fav' ? 'Toque no ♡ de uma música para curtir.' : 'Playlist vazia. Use o menu ⋮ de uma música para adicionar aqui.'}</div>`;
  }
  main.innerHTML = html;
}

function markPlaying() {
  const cur = current();
  document.querySelectorAll('.row[data-id]').forEach(r => r.classList.toggle('playing', !!cur && r.dataset.id === cur.id));
}

// ---------- Reprodução ----------
function playList(list, i) {
  queue = [...list];
  if (shuffle) {
    const first = queue.splice(i, 1)[0];
    for (let k = queue.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [queue[k], queue[j]] = [queue[j], queue[k]]; }
    queue.unshift(first); i = 0;
  }
  playAt(i);
}

async function playAt(i) {
  if (i < 0 || i >= queue.length) return;
  qIndex = i;
  const t = queue[i];
  const file = await getFile(t.id);
  if (!file) { toast('Arquivo não encontrado'); return; }
  if (audio.src) URL.revokeObjectURL(audio.src);
  audio.src = URL.createObjectURL(file);
  audio.play().catch(() => {});
  renderNow();
  markPlaying();
  media.meta(t);
  document.title = `${t.title} · ${t.artist}`;
}

function next(auto) {
  if (!queue.length) return;
  if (auto && repeat === 'one') { audio.currentTime = 0; audio.play(); return; }
  if (qIndex + 1 < queue.length) playAt(qIndex + 1);
  else if (repeat === 'all' || !auto) playAt(0);
  else { audio.pause(); audio.currentTime = 0; }
}
function prev() {
  if (audio.currentTime > 3 || qIndex <= 0) { audio.currentTime = 0; return; }
  playAt(qIndex - 1);
}
function togglePlay() {
  if (!audio.src) { const l = listFor({ type: 'all' }); if (l.length) playList(l, 0); return; }
  audio.paused ? audio.play() : audio.pause();
}

function renderNow() {
  const t = current();
  $('mini').classList.toggle('show', !!t);
  if (!t) return;
  $('miniArt').innerHTML = coverHtml(t);
  $('miniTitle').textContent = $('fullTitle').textContent = t.title;
  $('miniArtist').textContent = $('fullArtist').textContent = t.artist;
  $('fullArt').innerHTML = t.cover ? `<img src="${coverUrl(t)}" alt="">` : `<div class="cover-ph">${icon('note')}</div>`;
  for (const id of ['miniFav', 'fullFav']) { setIcon($(id), t.fav ? 'heart' : 'heart-o'); $(id).classList.toggle('on', t.fav); }
}

async function toggleFav(t) {
  t.fav = !t.fav; await put('tracks', t);
  toast(t.fav ? 'Adicionada às Curtidas' : 'Removida das Curtidas');
  renderNow(); if (view.type !== 'search') render(); else markPlaying();
}

// ---------- Folha de opções ----------
function openSheet(html) {
  $('sheet').innerHTML = `<div class="handle"></div>` + html;
  $('sheet').classList.add('open'); $('backdrop').classList.add('open');
}
function closeSheet() { $('sheet').classList.remove('open'); $('backdrop').classList.remove('open'); }
$('backdrop').onclick = closeSheet;

function trackSheet(t) {
  const opt = (act, ic, label, cls = '') => `<button class="opt ${cls}" data-s="${act}">${icon(ic)}${label}</button>`;
  openSheet(`
    <div class="head">${coverHtml(t)}<div class="meta" style="min-width:0"><div class="t-title">${esc(t.title)}</div><div class="t-artist">${esc(t.artist)}</div></div></div>
    ${opt('fav', t.fav ? 'heart' : 'heart-o', t.fav ? 'Remover das Curtidas' : 'Curtir')}
    ${opt('next', 'queue', 'Tocar em seguida')}
    ${opt('addpl', 'plus', 'Adicionar à playlist')}
    ${view.type === 'pl' ? opt('rmpl', 'minus', 'Remover desta playlist') : ''}
    ${opt('del', 'trash', 'Excluir do app', 'danger')}`);
  $('sheet').onclick = async e => {
    const b = e.target.closest('[data-s]'); if (!b) return;
    const act = b.dataset.s;
    if (act === 'addpl') return playlistPicker(t);
    closeSheet();
    if (act === 'fav') return toggleFav(t);
    if (act === 'next') {
      if (!queue.length) playList([t], 0); else queue.splice(qIndex + 1, 0, t);
      toast('Vai tocar em seguida');
    } else if (act === 'rmpl') {
      const p = playlists.find(p => p.id === view.id);
      p.tracks = p.tracks.filter(id => id !== t.id); await put('playlists', p); render();
    } else if (act === 'del') {
      if (!confirm(`Excluir "${t.title}" do app?`)) return;
      await del('tracks', t.id); await del('files', t.id);
      tracks = tracks.filter(x => x !== t);
      for (const p of playlists) if (p.tracks.includes(t.id)) { p.tracks = p.tracks.filter(id => id !== t.id); await put('playlists', p); }
      render(); toast('Música excluída');
    }
  };
}

function playlistPicker(t) {
  openSheet(`<div class="head"><div class="t-title">Adicionar à playlist</div></div>
    <button class="opt" data-p="new">${icon('plus')}Nova playlist</button>
    ${playlists.map(p => `<button class="opt" data-p="${p.id}">${icon('note')}${esc(p.name)}</button>`).join('')}`);
  $('sheet').onclick = async e => {
    const b = e.target.closest('[data-p]'); if (!b) return;
    closeSheet();
    const p = b.dataset.p === 'new' ? await createPlaylist() : playlists.find(p => p.id === b.dataset.p);
    if (!p) return;
    if (!p.tracks.includes(t.id)) { p.tracks.push(t.id); await put('playlists', p); }
    toast(`Adicionada a "${p.name}"`);
  };
}

function playlistSheet(p) {
  openSheet(`<div class="head"><div class="t-title">${esc(p.name)}</div></div>
    <button class="opt" data-s="rename">${icon('edit')}Renomear</button>
    <button class="opt danger" data-s="delete">${icon('trash')}Excluir playlist</button>`);
  $('sheet').onclick = async e => {
    const b = e.target.closest('[data-s]'); if (!b) return;
    closeSheet();
    if (b.dataset.s === 'rename') {
      const n = prompt('Novo nome:', p.name); if (!n || !n.trim()) return;
      p.name = n.trim(); await put('playlists', p); render();
    } else if (confirm(`Excluir a playlist "${p.name}"?`)) {
      await del('playlists', p.id); playlists = playlists.filter(x => x !== p);
      view = { type: 'pls' }; render();
    }
  };
}

async function createPlaylist() {
  const name = prompt('Nome da playlist:', `Minha playlist nº ${playlists.length + 1}`);
  if (!name || !name.trim()) return null;
  const p = { id: 'pl-' + Date.now(), name: name.trim(), tracks: [] };
  await put('playlists', p); playlists.push(p);
  return p;
}

// ---------- Eventos ----------
$('main').addEventListener('click', async e => {
  const act = e.target.closest('[data-act]')?.dataset.act;
  const row = e.target.closest('.row');
  if (act === 'add') return addSheet();
  if (act === 'folder') return $('folderInput').click();
  if (act === 'playall') { const l = listFor(view); return playList(l, shuffle ? Math.floor(Math.random() * l.length) : 0); }
  if (act === 'plmenu') return playlistSheet(playlists.find(p => p.id === view.id));
  if (act === 'newpl') { const p = await createPlaylist(); if (p) { view = { type: 'pl', id: p.id }; render(); } return; }
  if (!row) return;
  if (row.dataset.go) { view = { type: row.dataset.go }; return render(); }
  if (row.dataset.pl) { view = { type: 'pl', id: row.dataset.pl }; return render(); }
  const t = tracks.find(t => t.id === row.dataset.id);
  if (act === 'more') return trackSheet(t);
  if (row.dataset.id) playList(listFor(view), +row.dataset.i);
});
$('main').addEventListener('contextmenu', e => {
  const row = e.target.closest('.row[data-id]'); if (!row) return;
  e.preventDefault(); trackSheet(tracks.find(t => t.id === row.dataset.id));
});

document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (!b) return;
  view = { type: b.dataset.tab };
  render(); scrollTo(0, 0);
  if (view.type === 'search') $('search').focus();
});

$('addBtn').onclick = addSheet;
$('fileInput').onchange = e => { importFiles(e.target.files); e.target.value = ''; };
$('folderInput').onchange = e => { importFiles(e.target.files); e.target.value = ''; };

$('mini').onclick = e => {
  if (e.target.closest('#miniPlay')) return togglePlay();
  if (e.target.closest('#miniFav')) return toggleFav(current());
  $('full').classList.add('open');
};
$('closeFull').onclick = () => $('full').classList.remove('open');
$('fullFav').onclick = () => toggleFav(current());
$('fullMore').onclick = () => current() && trackSheet(current());
// Arrastar para baixo fecha o player
let touchY = null;
$('full').addEventListener('touchstart', e => { if (!e.target.closest('input')) touchY = e.touches[0].clientY; }, { passive: true });
$('full').addEventListener('touchend', e => {
  if (touchY !== null && e.changedTouches[0].clientY - touchY > 100) $('full').classList.remove('open');
  touchY = null;
});

$('play').onclick = togglePlay;
$('next').onclick = () => next(false);
$('prev').onclick = prev;
$('shuffle').onclick = () => { shuffle = !shuffle; $('shuffle').classList.toggle('on', shuffle); toast(shuffle ? 'Aleatório ligado' : 'Aleatório desligado'); };
$('repeat').onclick = () => {
  repeat = repeat === 'off' ? 'all' : repeat === 'all' ? 'one' : 'off';
  setIcon($('repeat'), repeat === 'one' ? 'repeat1' : 'repeat');
  $('repeat').classList.toggle('on', repeat !== 'off');
  toast({ off: 'Repetir desligado', all: 'Repetir tudo', one: 'Repetir esta música' }[repeat]);
};
let seeking = false;
$('seek').oninput = () => { seeking = true; $('cur').textContent = fmt($('seek').value / 1000 * (audio.duration || 0)); };
$('seek').onchange = () => { if (audio.duration) audio.currentTime = $('seek').value / 1000 * audio.duration; seeking = false; };

audio.ontimeupdate = () => {
  const p = audio.duration ? audio.currentTime / audio.duration : 0;
  $('miniBar').style.width = (p * 100) + '%';
  $('dur').textContent = fmt(audio.duration);
  if (!seeking) { $('cur').textContent = fmt(audio.currentTime); $('seek').value = p * 1000; }
};
const syncPlay = () => {
  const n = audio.paused ? 'play' : 'pause'; setIcon($('play'), n); setIcon($('miniPlay'), n);
  media.state(audio.paused ? 'paused' : 'playing'); media.pos();
};
audio.onplay = audio.onpause = syncPlay;
audio.onseeked = audio.onloadedmetadata = () => media.pos();
audio.onended = () => next(true);

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.code === 'ArrowRight' && e.shiftKey) next(false);
  else if (e.code === 'ArrowLeft' && e.shiftKey) prev();
  else if (e.code === 'Escape') { closeSheet(); $('full').classList.remove('open'); }
});

// ---------- Controles do sistema (tela de bloqueio, notificação, fone) ----------
// No app Android usa o plugin nativo, que também mantém a música tocando com a tela desligada.
const isNative = !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform());
const NativeMS = isNative && Capacitor.Plugins && Capacitor.Plugins.MediaSession;
const blobToDataUrl = blob => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => res(null); r.readAsDataURL(blob); });
const media = {
  async meta(t) {
    if (NativeMS) {
      const art = t.cover ? await blobToDataUrl(t.cover) : null;
      NativeMS.setMetadata({ title: t.title, artist: t.artist, album: t.album, artwork: art ? [{ src: art }] : [] }).catch(() => {});
    } else if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: t.title, artist: t.artist, album: t.album,
        artwork: t.cover ? [{ src: coverUrl(t), sizes: '512x512', type: t.cover.type }] : [{ src: 'icons/icon-512.png', sizes: '512x512', type: 'image/png' }]
      });
    }
  },
  state(s) {
    if (NativeMS) NativeMS.setPlaybackState({ playbackState: s }).catch(() => {});
    else if ('mediaSession' in navigator) navigator.mediaSession.playbackState = s;
  },
  pos() {
    if (!audio.duration || !isFinite(audio.duration)) return;
    const st = { duration: audio.duration, position: Math.min(audio.currentTime, audio.duration), playbackRate: audio.paused ? 0 : 1 };
    if (NativeMS) NativeMS.setPositionState(st).catch(() => {});
    else if ('mediaSession' in navigator && navigator.mediaSession.setPositionState) {
      try { navigator.mediaSession.setPositionState({ ...st, playbackRate: 1 }); } catch (e) {}
    }
  },
  handler(action, fn) {
    if (NativeMS) NativeMS.setActionHandler({ action }, fn);
    else if ('mediaSession' in navigator) { try { navigator.mediaSession.setActionHandler(action, fn); } catch (e) {} }
  }
};
media.handler('play', () => audio.play());
media.handler('pause', () => audio.pause());
media.handler('nexttrack', () => next(false));
media.handler('previoustrack', prev);
media.handler('seekto', d => { audio.currentTime = d.seekTime; });

// Botão "voltar" do Android: fecha o que estiver aberto antes de sair
if (isNative && Capacitor.Plugins.App) {
  Capacitor.Plugins.App.addListener('backButton', () => {
    if ($('sheet').classList.contains('open')) closeSheet();
    else if ($('full').classList.contains('open')) $('full').classList.remove('open');
    else if (view.type !== 'all') { view = { type: 'all' }; render(); }
    else Capacitor.Plugins.App.minimizeApp();
  });
}

// Arrastar e soltar (computador)
let dragDepth = 0;
addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging'); importFiles(e.dataTransfer.files); });

// ---------- Instalar como app ----------
let installEvt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); if (isNative) return; installEvt = e; $('installBtn').hidden = false; });
addEventListener('appinstalled', () => { $('installBtn').hidden = true; toast('App instalado!'); });
$('installBtn').onclick = async () => {
  if (installEvt) { installEvt.prompt(); await installEvt.userChoice; installEvt = null; $('installBtn').hidden = true; }
  else alert('No iPhone: toque em Compartilhar (□↑) e depois em "Adicionar à Tela de Início".');
};
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !standalone && !isNative) $('installBtn').hidden = false;

if ('serviceWorker' in navigator && location.protocol !== 'file:' && !isNative) navigator.serviceWorker.register('sw.js');

// ---------- Início ----------
(async () => {
  db = await openDB();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  tracks = await getAll('tracks');
  playlists = await getAll('playlists');
  render();
})();
</script>
</body>
</html>
