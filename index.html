<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minhas Músicas</title>
<style>
  :root {
    --bg: #121212; --panel: #000; --card: #181818; --hover: #282828;
    --text: #fff; --muted: #b3b3b3; --accent: #1db954;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--panel); color: var(--text); height: 100vh; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  .app { display: grid; grid-template-columns: 240px 1fr; grid-template-rows: 1fr 90px; height: 100vh; gap: 8px; padding: 8px 8px 0; }

  /* Sidebar */
  .sidebar { background: var(--bg); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
  .logo { font-weight: 800; font-size: 20px; padding: 4px 8px 16px; white-space: nowrap; }
  .logo span { color: var(--accent); }
  .nav-item { text-align: left; padding: 10px 12px; border-radius: 6px; color: var(--muted); font-weight: 600; display: flex; gap: 10px; align-items: center; }
  .nav-item:hover { color: var(--text); }
  .nav-item.active { color: var(--text); background: var(--hover); }
  .section-title { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; padding: 16px 12px 6px; display: flex; justify-content: space-between; align-items: center; }
  .section-title button { font-size: 20px; color: var(--muted); }
  .section-title button:hover { color: var(--text); }

  /* Main */
  .main { background: linear-gradient(180deg, #1f3a2a 0, var(--bg) 280px); border-radius: 8px; overflow-y: auto; padding: 24px 28px; }
  .header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .header h1 { font-size: 40px; font-weight: 800; }
  .header .sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn { background: var(--accent); color: #000; font-weight: 700; padding: 10px 20px; border-radius: 999px; }
  .btn:hover { transform: scale(1.04); }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid #727272; }
  .search { background: #242424; border: 1px solid transparent; color: var(--text); padding: 10px 16px; border-radius: 999px; width: 240px; font: inherit; }
  .search:focus { outline: none; border-color: #fff; }

  .play-big { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: #000; font-size: 22px; display: grid; place-items: center; }
  .play-big:hover { transform: scale(1.06); }

  table { width: 100%; border-collapse: collapse; margin-top: 16px; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: 13px; padding: 8px; border-bottom: 1px solid #2a2a2a; }
  td { padding: 8px; font-size: 14px; color: var(--muted); vertical-align: middle; }
  tr.row { cursor: default; }
  tr.row:hover td { background: #2a2a2a; }
  tr.row td:first-child { border-radius: 6px 0 0 6px; width: 40px; text-align: center; }
  tr.row td:last-child { border-radius: 0 6px 6px 0; text-align: right; white-space: nowrap; }
  tr.row.playing .t-title, tr.row.playing td:first-child { color: var(--accent); }
  .t-info { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .t-info img, .cover-ph { width: 40px; height: 40px; border-radius: 4px; object-fit: cover; flex-shrink: 0; }
  .cover-ph { background: #333; display: grid; place-items: center; color: #777; font-size: 18px; }
  .t-title { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t-artist { font-size: 13px; }
  .row-btn { opacity: 0; padding: 4px 6px; color: var(--muted); }
  tr.row:hover .row-btn, .row-btn.on { opacity: 1; }
  .row-btn:hover { color: var(--text); }
  .row-btn.on { color: var(--accent); }

  .empty { text-align: center; padding: 80px 20px; color: var(--muted); }
  .empty h2 { color: var(--text); margin-bottom: 8px; }
  .empty .btn { margin-top: 20px; }
  .drop-hint { position: fixed; inset: 0; background: rgba(29,185,84,.15); border: 3px dashed var(--accent); display: none; place-items: center; font-size: 28px; font-weight: 800; z-index: 50; pointer-events: none; }
  body.dragging .drop-hint { display: grid; }

  /* Player */
  .player { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 2fr 1fr; align-items: center; padding: 0 12px; gap: 16px; }
  .now { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .now img, .now .cover-ph { width: 56px; height: 56px; }
  .now .t-title { font-size: 14px; }
  .now .t-artist { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .controls { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .ctrl-row { display: flex; align-items: center; gap: 20px; }
  .ctrl { color: var(--muted); font-size: 18px; }
  .ctrl:hover { color: var(--text); }
  .ctrl.on { color: var(--accent); position: relative; }
  .ctrl.on::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 4px; height: 4px; background: var(--accent); border-radius: 50%; transform: translateX(-50%); }
  .play-btn { width: 34px; height: 34px; border-radius: 50%; background: #fff; color: #000; display: grid; place-items: center; font-size: 14px; }
  .play-btn:hover { transform: scale(1.06); }
  .progress { display: flex; align-items: center; gap: 8px; width: 100%; max-width: 600px; font-size: 12px; color: var(--muted); }
  .progress span { width: 40px; text-align: center; }
  input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; height: 4px; border-radius: 2px; background: #4d4d4d; cursor: pointer; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #fff; }
  input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: #fff; border: none; }
  .right { display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
  .right input { max-width: 110px; }

  /* Menu */
  .menu { position: fixed; background: #282828; border-radius: 6px; padding: 4px; box-shadow: 0 16px 24px rgba(0,0,0,.5); z-index: 100; min-width: 200px; display: none; }
  .menu button { display: block; width: 100%; text-align: left; padding: 10px 12px; border-radius: 4px; font-size: 14px; }
  .menu button:hover { background: #3e3e3e; }
  .menu hr { border: none; border-top: 1px solid #3e3e3e; margin: 4px 0; }

  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; padding: 0; gap: 0; }
    .sidebar { flex-direction: row; overflow-x: auto; border-radius: 0; padding: 8px; }
    .logo, .section-title { display: none; }
    .nav-item { white-space: nowrap; }
    .main { border-radius: 0; padding: 16px; }
    .header h1 { font-size: 28px; }
    .search { width: 100%; }
    .col-album, .col-hide { display: none; }
    .player { grid-template-columns: 1fr; padding: 8px 12px; gap: 6px; background: #181818; }
    .right { display: none; }
    .row-btn { opacity: 1; }
  }
</style>
</head>
<body>
<div class="drop-hint">Solte suas músicas aqui 🎵</div>
<div class="app">
  <aside class="sidebar">
    <div class="logo">🎧 Minhas <span>Músicas</span></div>
    <button class="nav-item active" data-view="all">🏠 Início</button>
    <button class="nav-item" data-view="fav">💚 Curtidas</button>
    <div class="section-title">Playlists <button id="newPl" title="Nova playlist">+</button></div>
    <div id="plList"></div>
  </aside>

  <main class="main" id="main"></main>

  <footer class="player">
    <div class="now" id="now"></div>
    <div class="controls">
      <div class="ctrl-row">
        <button class="ctrl" id="shuffle" title="Aleatório">🔀</button>
        <button class="ctrl" id="prev" title="Anterior">⏮</button>
        <button class="play-btn" id="play" title="Tocar/Pausar">▶</button>
        <button class="ctrl" id="next" title="Próxima">⏭</button>
        <button class="ctrl" id="repeat" title="Repetir">🔁</button>
      </div>
      <div class="progress">
        <span id="cur">0:00</span>
        <input type="range" id="seek" min="0" max="1000" value="0">
        <span id="dur">0:00</span>
      </div>
    </div>
    <div class="right">
      <button class="ctrl" id="mute">🔊</button>
      <input type="range" id="vol" min="0" max="100" value="80">
    </div>
  </footer>
</div>

<div class="menu" id="menu"></div>
<input type="file" id="fileInput" accept="audio/*" multiple hidden>
<input type="file" id="folderInput" webkitdirectory multiple hidden>
<audio id="audio"></audio>

<script>
// ---------- Armazenamento (IndexedDB) ----------
const DB_NAME = 'minhas-musicas', DB_VER = 1;
let db;
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('tracks', { keyPath: 'id' });
      d.createObjectStore('files');
      d.createObjectStore('playlists', { keyPath: 'id' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function tx(store, mode, fn) {
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode);
    const out = fn(t.objectStore(store));
    t.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
    t.onerror = () => rej(t.error);
  });
}
const getAll = s => tx(s, 'readonly', st => st.getAll());
const put = (s, v, k) => tx(s, 'readwrite', st => st.put(v, k));
const del = (s, k) => tx(s, 'readwrite', st => st.delete(k));
const getFile = id => tx('files', 'readonly', st => st.get(id));

// ---------- Leitura de tags ID3 (título, artista, álbum, capa) ----------
async function readTags(file) {
  const tags = {};
  try {
    const head = new Uint8Array(await file.slice(0, 10).arrayBuffer());
    if (head[0] !== 0x49 || head[1] !== 0x44 || head[2] !== 0x33) return tags; // "ID3"
    const ver = head[3];
    const size = (head[6] << 21) | (head[7] << 14) | (head[8] << 7) | head[9];
    const buf = new Uint8Array(await file.slice(10, 10 + size).arrayBuffer());
    const dec = (bytes, enc) => {
      const label = enc === 1 ? 'utf-16' : enc === 2 ? 'utf-16be' : enc === 3 ? 'utf-8' : 'latin1';
      return new TextDecoder(label).decode(bytes).replace(/\0+$/, '').split('\0')[0].trim();
    };
    let i = 0;
    const idLen = ver === 2 ? 3 : 4, hdrLen = ver === 2 ? 6 : 10;
    const map = ver === 2 ? { TT2: 'title', TP1: 'artist', TAL: 'album', PIC: 'pic' }
                          : { TIT2: 'title', TPE1: 'artist', TALB: 'album', APIC: 'pic' };
    while (i + hdrLen < buf.length) {
      const id = String.fromCharCode(...buf.slice(i, i + idLen));
      if (!/^[A-Z0-9]+$/.test(id)) break;
      let fsize;
      if (ver === 2) fsize = (buf[i+3] << 16) | (buf[i+4] << 8) | buf[i+5];
      else if (ver === 4) fsize = (buf[i+4] << 21) | (buf[i+5] << 14) | (buf[i+6] << 7) | buf[i+7];
      else fsize = (buf[i+4] << 24) | (buf[i+5] << 16) | (buf[i+6] << 8) | buf[i+7];
      const data = buf.slice(i + hdrLen, i + hdrLen + fsize);
      const key = map[id];
      if (key === 'pic') {
        const enc = data[0];
        let p = 1, mime = 'image/jpeg';
        if (ver === 2) { p = 4; if (String.fromCharCode(...data.slice(1, 4)) === 'PNG') mime = 'image/png'; }
        else { const e = data.indexOf(0, 1); mime = new TextDecoder().decode(data.slice(1, e)) || mime; p = e + 1; }
        p++; // tipo da imagem
        if (enc === 1 || enc === 2) { while (p < data.length - 1 && !(data[p] === 0 && data[p+1] === 0)) p += 2; p += 2; }
        else { while (p < data.length && data[p] !== 0) p++; p++; }
        if (!mime.includes('/')) mime = 'image/' + mime.toLowerCase().replace('jpg', 'jpeg');
        tags.cover = new Blob([data.slice(p)], { type: mime });
      } else if (key) {
        tags[key] = dec(data.slice(1), data[0]);
      }
      i += hdrLen + fsize;
    }
  } catch (e) { /* tags inválidas: usa o nome do arquivo */ }
  return tags;
}

function durationOf(file) {
  return new Promise(res => {
    const a = new Audio(), url = URL.createObjectURL(file);
    a.preload = 'metadata';
    a.onloadedmetadata = () => { res(a.duration || 0); URL.revokeObjectURL(url); };
    a.onerror = () => { res(0); URL.revokeObjectURL(url); };
    a.src = url;
  });
}

// ---------- Estado ----------
let tracks = [], playlists = [];
let view = { type: 'all' }, query = '';
let queue = [], qIndex = -1, shuffle = false, repeat = 'off'; // off | all | one
const coverUrls = {};
const audio = document.getElementById('audio');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const fmt = s => { s = Math.floor(s || 0); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const coverHtml = t => t && t.cover ? `<img src="${coverUrl(t)}" alt="">` : `<div class="cover-ph">♪</div>`;
function coverUrl(t) { return coverUrls[t.id] ||= URL.createObjectURL(t.cover); }

// ---------- Importar músicas ----------
async function importFiles(fileList) {
  const files = [...fileList].filter(f => f.type.startsWith('audio/') || /\.(mp3|m4a|aac|ogg|oga|opus|wav|flac|webm)$/i.test(f.name));
  if (!files.length) return;
  const existing = new Set(tracks.map(t => t.name + '|' + t.size));
  let added = 0;
  for (const [n, f] of files.entries()) {
    renderMain(`Importando ${n + 1} de ${files.length}…`);
    if (existing.has(f.name + '|' + f.size)) continue;
    const tags = await readTags(f);
    const base = f.name.replace(/\.[^.]+$/, '');
    let [artist, title] = base.includes(' - ') ? base.split(' - ', 2) : ['', base];
    const t = {
      id: crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random(),
      name: f.name, size: f.size,
      title: tags.title || title.trim(),
      artist: tags.artist || artist.trim() || 'Artista desconhecido',
      album: tags.album || '',
      cover: tags.cover || null,
      duration: await durationOf(f),
      fav: false, added: Date.now()
    };
    await put('files', f, t.id);
    await put('tracks', t);
    tracks.push(t);
    added++;
  }
  renderMain();
  renderSidebar();
}

// ---------- Visões ----------
function currentList() {
  let list;
  if (view.type === 'fav') list = tracks.filter(t => t.fav);
  else if (view.type === 'pl') {
    const pl = playlists.find(p => p.id === view.id);
    list = pl ? pl.tracks.map(id => tracks.find(t => t.id === id)).filter(Boolean) : [];
  } else list = [...tracks].sort((a, b) => a.title.localeCompare(b.title));
  if (query) {
    const q = query.toLowerCase();
    list = list.filter(t => (t.title + ' ' + t.artist + ' ' + t.album).toLowerCase().includes(q));
  }
  return list;
}

function renderSidebar() {
  document.querySelectorAll('.nav-item[data-view]').forEach(b => b.classList.toggle('active', view.type === b.dataset.view));
  $('plList').innerHTML = playlists.map(p =>
    `<button class="nav-item ${view.type === 'pl' && view.id === p.id ? 'active' : ''}" data-pl="${p.id}">🎶 ${esc(p.name)}</button>`
  ).join('');
}

function renderMain(loading) {
  const main = $('main');
  if (loading) { main.innerHTML = `<div class="empty"><h2>${loading}</h2></div>`; return; }
  const list = currentList();
  const pl = view.type === 'pl' ? playlists.find(p => p.id === view.id) : null;
  const title = view.type === 'fav' ? 'Músicas Curtidas' : pl ? pl.name : 'Sua Biblioteca';
  const totalDur = list.reduce((s, t) => s + (t.duration || 0), 0);

  let html = `
    <div class="header">
      <div>
        <h1>${esc(title)}</h1>
        <div class="sub">${list.length} música${list.length === 1 ? '' : 's'} · ${Math.round(totalDur / 60)} min</div>
      </div>
      <div class="actions">
        <input class="search" id="search" placeholder="🔍 Buscar música, artista…" value="${esc(query)}">
        ${view.type === 'all' ? `
          <button class="btn" id="addFiles">+ Adicionar músicas</button>
          <button class="btn ghost" id="addFolder">📁 Pasta</button>` : ''}
        ${pl ? `<button class="btn ghost" id="renamePl">Renomear</button><button class="btn ghost" id="deletePl">Excluir</button>` : ''}
      </div>
    </div>`;

  if (!tracks.length) {
    html += `<div class="empty"><h2>Sua biblioteca está vazia</h2>
      <p>Adicione suas músicas baixadas (MP3, M4A, FLAC, OGG, WAV…) ou arraste os arquivos para cá.</p>
      <button class="btn" id="addFiles2">+ Adicionar músicas</button></div>`;
  } else if (!list.length) {
    html += `<div class="empty"><p>${query ? 'Nada encontrado.' : view.type === 'fav' ? 'Curta músicas clicando no 🤍.' : 'Playlist vazia. Use o menu ⋯ de uma música para adicionar.'}</p></div>`;
  } else {
    const cur = queue[qIndex];
    html += `<button class="play-big" id="playAll" title="Tocar tudo">▶</button>
      <table><thead><tr><th>#</th><th>Título</th><th class="col-album">Álbum</th><th style="text-align:right">⏱</th></tr></thead><tbody>
      ${list.map((t, i) => `
        <tr class="row ${cur && cur.id === t.id ? 'playing' : ''}" data-i="${i}" data-id="${t.id}">
          <td>${cur && cur.id === t.id && !audio.paused ? '▶' : i + 1}</td>
          <td><div class="t-info">${coverHtml(t)}<div style="min-width:0">
            <div class="t-title">${esc(t.title)}</div><div class="t-artist">${esc(t.artist)}</div></div></div></td>
          <td class="col-album">${esc(t.album)}</td>
          <td><button class="row-btn ${t.fav ? 'on' : ''}" data-act="fav">${t.fav ? '💚' : '🤍'}</button>
            <span class="col-hide">${fmt(t.duration)}</span>
            <button class="row-btn" data-act="menu">⋯</button></td>
        </tr>`).join('')}
      </tbody></table>`;
  }
  main.innerHTML = html;

  const s = $('search');
  s.oninput = () => { query = s.value; const pos = s.selectionStart; renderMain(); const n = $('search'); n.focus(); n.setSelectionRange(pos, pos); };
  for (const id of ['addFiles', 'addFiles2']) if ($(id)) $(id).onclick = () => $('fileInput').click();
  if ($('addFolder')) $('addFolder').onclick = () => $('folderInput').click();
  if ($('playAll')) $('playAll').onclick = () => playList(list, shuffle ? Math.floor(Math.random() * list.length) : 0);
  if ($('renamePl')) $('renamePl').onclick = async () => {
    const n = prompt('Novo nome:', pl.name); if (!n) return;
    pl.name = n.trim(); await put('playlists', pl); renderSidebar(); renderMain();
  };
  if ($('deletePl')) $('deletePl').onclick = async () => {
    if (!confirm(`Excluir a playlist "${pl.name}"?`)) return;
    await del('playlists', pl.id); playlists = playlists.filter(p => p !== pl);
    view = { type: 'all' }; renderSidebar(); renderMain();
  };
}

// ---------- Reprodução ----------
function playList(list, i) {
  queue = [...list];
  if (shuffle) {
    const first = queue.splice(i, 1)[0];
    queue.sort(() => Math.random() - 0.5);
    queue.unshift(first); i = 0;
  }
  playAt(i);
}

async function playAt(i) {
  if (i < 0 || i >= queue.length) return;
  qIndex = i;
  const t = queue[i];
  const file = await getFile(t.id);
  if (!file) { alert('Arquivo não encontrado.'); return; }
  if (audio.src) URL.revokeObjectURL(audio.src);
  audio.src = URL.createObjectURL(file);
  await audio.play().catch(() => {});
  renderNow();
  renderMain();
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: t.title, artist: t.artist, album: t.album,
      artwork: t.cover ? [{ src: coverUrl(t) }] : []
    });
  }
  document.title = `${t.title} · ${t.artist}`;
}

function next(auto) {
  if (!queue.length) return;
  if (auto && repeat === 'one') { audio.currentTime = 0; audio.play(); return; }
  if (qIndex + 1 < queue.length) playAt(qIndex + 1);
  else if (repeat === 'all' || !auto) playAt(0);
  else { audio.pause(); audio.currentTime = 0; }
}
function prev() {
  if (audio.currentTime > 3 || qIndex <= 0) { audio.currentTime = 0; return; }
  playAt(qIndex - 1);
}
function togglePlay() {
  if (!audio.src) { const l = currentList(); if (l.length) playList(l, 0); return; }
  audio.paused ? audio.play() : audio.pause();
}

function renderNow() {
  const t = queue[qIndex];
  $('now').innerHTML = t ? `${coverHtml(t)}<div style="min-width:0"><div class="t-title">${esc(t.title)}</div><div class="t-artist">${esc(t.artist)}</div></div>
    <button class="row-btn ${t.fav ? 'on' : ''}" style="opacity:1" id="nowFav">${t.fav ? '💚' : '🤍'}</button>` : '';
  if ($('nowFav')) $('nowFav').onclick = () => toggleFav(t);
}

async function toggleFav(t) {
  t.fav = !t.fav; await put('tracks', t); renderMain(); renderNow();
}

// ---------- Menu de contexto ----------
function openMenu(x, y, t) {
  const m = $('menu');
  m.innerHTML = `
    <button data-m="next">⏭ Tocar em seguida</button>
    <hr>
    ${playlists.map(p => `<button data-m="add" data-pl="${p.id}">➕ Adicionar a "${esc(p.name)}"</button>`).join('')}
    <button data-m="newpl">➕ Nova playlist com esta música</button>
    ${view.type === 'pl' ? '<button data-m="rmpl">➖ Remover desta playlist</button>' : ''}
    <hr>
    <button data-m="del">🗑 Excluir da biblioteca</button>`;
  m.style.display = 'block';
  m.style.left = Math.min(x, innerWidth - m.offsetWidth - 8) + 'px';
  m.style.top = Math.min(y, innerHeight - m.offsetHeight - 8) + 'px';
  m.onclick = async e => {
    const b = e.target.closest('button'); if (!b) return;
    m.style.display = 'none';
    const act = b.dataset.m;
    if (act === 'next') {
      if (!queue.length) { playList([t], 0); return; }
      queue.splice(qIndex + 1, 0, t);
    } else if (act === 'add') {
      const p = playlists.find(p => p.id === b.dataset.pl);
      if (!p.tracks.includes(t.id)) { p.tracks.push(t.id); await put('playlists', p); }
    } else if (act === 'newpl') {
      const p = await createPlaylist(); if (p) { p.tracks.push(t.id); await put('playlists', p); }
    } else if (act === 'rmpl') {
      const p = playlists.find(p => p.id === view.id);
      p.tracks = p.tracks.filter(id => id !== t.id); await put('playlists', p);
    } else if (act === 'del') {
      if (!confirm(`Excluir "${t.title}" da biblioteca?`)) return;
      await del('tracks', t.id); await del('files', t.id);
      tracks = tracks.filter(x => x !== t);
      for (const p of playlists) if (p.tracks.includes(t.id)) { p.tracks = p.tracks.filter(id => id !== t.id); await put('playlists', p); }
    }
    renderMain();
  };
}
document.addEventListener('click', e => { if (!e.target.closest('#menu') && !e.target.closest('[data-act=menu]')) $('menu').style.display = 'none'; });

async function createPlaylist() {
  const name = prompt('Nome da playlist:', `Minha playlist nº ${playlists.length + 1}`);
  if (!name) return null;
  const p = { id: 'pl-' + Date.now(), name: name.trim(), tracks: [] };
  await put('playlists', p); playlists.push(p); renderSidebar();
  return p;
}

// ---------- Eventos ----------
$('main').addEventListener('click', e => {
  const row = e.target.closest('tr.row'); if (!row) return;
  const t = tracks.find(t => t.id === row.dataset.id);
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'fav') toggleFav(t);
  else if (act === 'menu') { e.stopPropagation(); const r = e.target.getBoundingClientRect(); openMenu(r.left - 180, r.bottom, t); }
});
$('main').addEventListener('dblclick', e => {
  const row = e.target.closest('tr.row'); if (!row || e.target.closest('[data-act]')) return;
  playList(currentList(), +row.dataset.i);
});
$('main').addEventListener('contextmenu', e => {
  const row = e.target.closest('tr.row'); if (!row) return;
  e.preventDefault(); openMenu(e.clientX, e.clientY, tracks.find(t => t.id === row.dataset.id));
});
// No celular, um toque já toca a música
$('main').addEventListener('click', e => {
  if (matchMedia('(max-width: 760px)').matches) {
    const row = e.target.closest('tr.row'); if (!row || e.target.closest('[data-act]')) return;
    playList(currentList(), +row.dataset.i);
  }
});

document.querySelector('.sidebar').addEventListener('click', e => {
  const b = e.target.closest('.nav-item'); if (!b) return;
  view = b.dataset.pl ? { type: 'pl', id: b.dataset.pl } : { type: b.dataset.view };
  query = ''; renderSidebar(); renderMain();
});
$('newPl').onclick = async () => { const p = await createPlaylist(); if (p) { view = { type: 'pl', id: p.id }; renderSidebar(); renderMain(); } };

$('fileInput').onchange = e => { importFiles(e.target.files); e.target.value = ''; };
$('folderInput').onchange = e => { importFiles(e.target.files); e.target.value = ''; };

$('play').onclick = togglePlay;
$('next').onclick = () => next(false);
$('prev').onclick = prev;
$('shuffle').onclick = () => { shuffle = !shuffle; $('shuffle').classList.toggle('on', shuffle); };
$('repeat').onclick = () => {
  repeat = repeat === 'off' ? 'all' : repeat === 'all' ? 'one' : 'off';
  $('repeat').textContent = repeat === 'one' ? '🔂' : '🔁';
  $('repeat').classList.toggle('on', repeat !== 'off');
};
$('seek').oninput = () => { if (audio.duration) audio.currentTime = $('seek').value / 1000 * audio.duration; };
$('vol').oninput = () => { audio.volume = $('vol').value / 100; audio.muted = false; updateMute(); localStorage.setItem('vol', $('vol').value); };
$('mute').onclick = () => { audio.muted = !audio.muted; updateMute(); };
function updateMute() { $('mute').textContent = audio.muted || audio.volume === 0 ? '🔇' : audio.volume < .5 ? '🔉' : '🔊'; }

audio.ontimeupdate = () => {
  $('cur').textContent = fmt(audio.currentTime);
  $('dur').textContent = fmt(audio.duration);
  if (audio.duration) $('seek').value = audio.currentTime / audio.duration * 1000;
};
audio.onplay = () => { $('play').textContent = '⏸'; renderMain(); };
audio.onpause = () => { $('play').textContent = '▶'; renderMain(); };
audio.onended = () => next(true);

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.code === 'ArrowRight' && e.shiftKey) next(false);
  else if (e.code === 'ArrowLeft' && e.shiftKey) prev();
});

if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', () => audio.play());
  navigator.mediaSession.setActionHandler('pause', () => audio.pause());
  navigator.mediaSession.setActionHandler('nexttrack', () => next(false));
  navigator.mediaSession.setActionHandler('previoustrack', prev);
}

// Arrastar e soltar
let dragDepth = 0;
addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging'); importFiles(e.dataTransfer.files); });

// ---------- Início ----------
(async () => {
  try { const v = localStorage.getItem('vol'); if (v) $('vol').value = v; } catch (e) {}
  audio.volume = $('vol').value / 100;
  db = await openDB();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  tracks = await getAll('tracks');
  playlists = await getAll('playlists');
  renderSidebar();
  renderMain();
})();
</script>
</body>
</html>
