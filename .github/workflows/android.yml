name: Gerar APK Android

on:
  push:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm ci

      - name: Copiar o app para o projeto Android
        run: npm run sync

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk ../MinhasMusicas.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk ../MinhasMusicas-32bits.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MinhasMusicas-apk
          path: MinhasMusicas*.apk

      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Minhas Músicas 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Baixe o **MinhasMusicas.apk** abaixo no celular Android e abra o arquivo para instalar.
            Se o Android pedir, permita "instalar apps desta fonte".

            Celular antigo (32 bits)? Se aparecer "app não instalado", use o **MinhasMusicas-32bits.apk**.
          files: MinhasMusicas*.apk
